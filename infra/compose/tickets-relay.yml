# Outbox relay of tickets-service: its own package and image (apps/tickets-relay-service), reading
# tickets-db. Stateless: scale with `--scale tickets-relay=N`, instances share the work through
# FOR UPDATE SKIP LOCKED. Included by ../docker-compose.yml so it shares the project and network.
services:
  tickets-relay:
    profiles: ['apps']
    build:
      context: ../..
      dockerfile: apps/tickets-relay-service/Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      tickets-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      OTEL_SERVICE_NAME: tickets-relay-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      LOG_LEVEL: info
      DATABASE_URL: postgresql://tickets:tickets@tickets-db:5432/tickets
      RABBITMQ_URL: amqp://ticketmanager:ticketmanager@rabbitmq:5672
      EVENTS_EXCHANGE: ticketmanager.events
