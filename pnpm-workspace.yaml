packages:
  - apps/*
  - packages/*

# Single source of truth for versions shared across packages.
# Reference with "catalog:" in any package.json.
catalog:
  '@types/node': ^24.0.0
  prettier: ^3.9.10
  typescript: ^6.0.3
  vitest: ^4.1.2
  zod: ^4.6.7

# pnpm 12: dependencies allowed (or denied) to run install scripts.
allowBuilds:
  sharp: false
  unrs-resolver: false
