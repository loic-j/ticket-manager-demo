# Local infrastructure. Default profile: Logto (auth) + its PostgreSQL + one PostgreSQL per
# service + RabbitMQ + Mailpit (local mail catcher). Profile "apps" adds the service images
# (tickets :3001, notifications :3002, directory :3003, web :3000) and their workers (see
# docker-compose.docker.yml for the Logto override).
#   pnpm infra:up / infra:down / infra:logs      pnpm docker:build / docker:up / docker:down
# Console: http://localhost:3302   OIDC endpoint: http://localhost:3301
# Mailpit UI: http://localhost:8025   RabbitMQ UI: http://localhost:15672
# tickets-db: localhost:5433   notifications-db: localhost:5434   valkey (tickets read cache): localhost:6379
# Grafana (traces, metrics, logs): http://localhost:3030   OTLP: localhost:4318 (see compose/observability.yml)
#
# Secrets: `${VAR}` references are interpolated from `infra/.env` (the `.env` of the project
# directory, which Compose takes from the first `-f` file), never injected wholesale with
# `env_file`, so each container only receives the variables it uses. Copy `infra/.env.example`.
name: ticketmanager

# Worker processes live in their own files (one image each) but in the same project.
include:
  - compose/tickets-relay.yml
  - compose/notifications-email-retry.yml
  - compose/observability.yml

services:
  logto:
    image: svhd/logto:1.45
    depends_on:
      logto-db:
        condition: service_healthy
    entrypoint: ['sh', '-c', 'npm run cli db seed -- --swe && npm start']
    # Logto listens directly on 3301/3302 (defaults are 3001/3002, reserved for our services).
    # Do NOT remap with ENDPOINT/ADMIN_ENDPOINT on localhost: Logto's CORS then sees two
    # localhost admin origins and rejects both, which breaks the admin console.
    ports:
      - '3301:3301' # core / OIDC
      - '3302:3302' # admin console
    environment:
      DB_URL: postgres://postgres:p0stgr3s@logto-db:5432/logto
      PORT: 3301
      ADMIN_PORT: 3302
    # The image is Alpine-based with busybox wget (no curl). Seeding + start take a while.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:3301/oidc/.well-known/openid-configuration >/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  logto-db:
    image: postgres:17-alpine
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: p0stgr3s
    volumes:
      - logto-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local mail catcher: Logto sends verification codes here, read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '8025:8025' # web UI
      - '1025:1025' # SMTP (from the host)
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  tickets-db:
    image: postgres:17-alpine
    user: postgres
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    ports:
      - '5433:5432'
    volumes:
      - tickets-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tickets -d tickets']
      interval: 5s
      timeout: 5s
      retries: 10

  notifications-db:
    image: postgres:17-alpine
    user: postgres
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
      POSTGRES_DB: notifications
    ports:
      - '5434:5432'
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notifications -d notifications']
      interval: 5s
      timeout: 5s
      retries: 10

  # Message broker between services. Management UI: http://localhost:15672 (ticketmanager / ticketmanager)
  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    hostname: rabbitmq
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # management UI
    environment:
      RABBITMQ_DEFAULT_USER: ticketmanager
      RABBITMQ_DEFAULT_PASS: ticketmanager
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 10s
      timeout: 10s
      retries: 10

  # Read cache of tickets-service (Redis-compatible, BSD licensed). Volatile by design: nothing
  # is persisted, a restart only empties the cache.
  valkey:
    image: valkey/valkey:9.1-alpine
    command:
      [
        'valkey-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  tickets-migrate:
    profiles: ['apps']
    build:
      context: ..
      dockerfile: apps/tickets-service/Dockerfile
      target: migrate
    depends_on:
      tickets-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tickets:tickets@tickets-db:5432/tickets

  # HTTP API only: the broker is talked to by tickets-relay (compose/tickets-relay.yml).
  tickets-service:
    profiles: ['apps']
    build:
      context: ..
      dockerfile: apps/tickets-service/Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      tickets-migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      logto:
        condition: service_healthy
    ports:
      - '3001:3001'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      OTEL_SERVICE_NAME: tickets-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      LOG_LEVEL: info
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://tickets:tickets@tickets-db:5432/tickets
      CACHE_URL: redis://valkey:6379
      LOGTO_ENDPOINT: http://host.docker.internal:3301
      LOGTO_API_RESOURCE: https://api.ticketmanager.local
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  notifications-migrate:
    profiles: ['apps']
    build:
      context: ..
      dockerfile: apps/notifications-service/Dockerfile
      target: migrate
    depends_on:
      notifications-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://notifications:notifications@notifications-db:5432/notifications

  notifications-service:
    profiles: ['apps']
    build:
      context: ..
      dockerfile: apps/notifications-service/Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
      logto:
        condition: service_healthy
      directory-service:
        condition: service_healthy
    ports:
      - '3002:3002'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      OTEL_SERVICE_NAME: notifications-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      LOG_LEVEL: info
      # Local stack: enables the dev fallbacks when no M2M app is configured; production
      # deployments set NODE_ENV=production (the image default) and require the M2M app.
      NODE_ENV: development
      PORT: 3002
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://notifications:notifications@notifications-db:5432/notifications
      LOGTO_ENDPOINT: http://host.docker.internal:3301
      LOGTO_API_RESOURCE: https://notifications.ticketmanager.local
      LOGTO_M2M_APP_ID: ${LOGTO_M2M_APP_ID:-}
      LOGTO_M2M_APP_SECRET: ${LOGTO_M2M_APP_SECRET:-}
      NOTIFICATIONS_DEV_FALLBACK_EMAIL: ${NOTIFICATIONS_DEV_FALLBACK_EMAIL:-}
      RABBITMQ_URL: amqp://ticketmanager:ticketmanager@rabbitmq:5672
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: Ticket Manager <noreply@ticketmanager.local>
      DIRECTORY_API_URL: http://directory-service:3003
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3002/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  # User directory: read-only facade over the Logto Management API, no database (ADR 002).
  directory-service:
    profiles: ['apps']
    build:
      context: ..
      dockerfile: apps/directory-service/Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      logto:
        condition: service_healthy
    ports:
      - '3003:3003'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      OTEL_SERVICE_NAME: directory-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      LOG_LEVEL: info
      # Local stack: enables the dev fallbacks when no M2M app is configured; production
      # deployments set NODE_ENV=production (the image default) and require the M2M app.
      NODE_ENV: development
      PORT: 3003
      LOGTO_ENDPOINT: http://host.docker.internal:3301
      LOGTO_API_RESOURCE: https://directory.ticketmanager.local
      LOGTO_M2M_APP_ID: ${LOGTO_M2M_APP_ID:-}
      LOGTO_M2M_APP_SECRET: ${LOGTO_M2M_APP_SECRET:-}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3003/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  web:
    profiles: ['apps']
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      tickets-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
      directory-service:
        condition: service_healthy
    ports:
      - '3000:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      TICKETS_API_URL: http://tickets-service:3001
      NOTIFICATIONS_API_URL: http://notifications-service:3002
      DIRECTORY_API_URL: http://directory-service:3003
      BASE_URL: http://localhost:3000
      LOGTO_ENDPOINT: http://host.docker.internal:3301
      # Required: Compose refuses to start without them (`:?`).
      LOGTO_APP_ID: ${LOGTO_APP_ID:?set it in infra/.env (copy infra/.env.example)}
      LOGTO_APP_SECRET: ${LOGTO_APP_SECRET:?set it in infra/.env (copy infra/.env.example)}
      LOGTO_COOKIE_SECRET: ${LOGTO_COOKIE_SECRET:?set it in infra/.env (copy infra/.env.example)}

volumes:
  logto-db-data:
  tickets-db-data:
  notifications-db-data:
  rabbitmq-data:
