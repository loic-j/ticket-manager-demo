# Logto (auth server) + its own PostgreSQL. Local development only.
# Start:  pnpm logto:up      Stop: pnpm logto:down      Logs: pnpm logto:logs
# Console: http://localhost:3302   OIDC endpoint: http://localhost:3301
name: ticketmanager-logto

services:
  logto:
    image: svhd/logto:1.45
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['sh', '-c', 'npm run cli db seed -- --swe && npm start']
    # Logto listens directly on 3301/3302 (defaults are 3001/3002, taken by our API).
    # Do NOT remap with ENDPOINT/ADMIN_ENDPOINT on localhost: Logto's CORS then sees two
    # localhost admin origins and rejects both, which breaks the admin console.
    ports:
      - '3301:3301' # core / OIDC
      - '3302:3302' # admin console
    environment:
      DB_URL: postgres://postgres:p0stgr3s@postgres:5432/logto
      PORT: 3301
      ADMIN_PORT: 3302

  postgres:
    image: postgres:17-alpine
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: p0stgr3s
    volumes:
      - logto-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  logto-pg-data:
